name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy --python-version "${{ matrix.python-version }}" src

      - name: Run tests
        run: python -m pytest

      - name: Validate dbt project structure
        run: python scripts/validate_dbt_project.py

      - name: Validate technician-note enrichment assets
        run: python scripts/validate_note_enrichment_assets.py

      - name: Parse dbt project
        env:
          SNOWFLAKE_ACCOUNT: example-account
          SNOWFLAKE_USER: example-user
          SNOWFLAKE_PASSWORD: example-password
          SNOWFLAKE_AUTHENTICATOR: snowflake
          SNOWFLAKE_WAREHOUSE: INDUSTRIAL_SERVICE_WH
          SNOWFLAKE_DATABASE: INDUSTRIAL_SERVICE_DB
          DBT_SNOWFLAKE_ROLE: ISP_TRANSFORMER
        run: |
          cp dbt/profiles.example.yml dbt/profiles.yml
          python scripts/run_dbt.py parse --no-partial-parse
