version: 2

models:
  - name: stg_erp_service_costs
    description: Deduplicated service-cost transactions with fixed-precision EUR amounts.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 16863
    columns:
      - name: service_cost_id
        description: Typed source field service_cost_id.
        data_tests:
          - not_null
          - unique
      - name: service_order_id
        description: Typed source field service_order_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_erp_service_orders')
                field: service_order_id
      - name: cost_type
        description: Typed source field cost_type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["LABOUR", "TRAVEL", "PART", "EXTERNAL_SERVICE"]
      - name: cost_amount_eur
        description: Typed source field cost_amount_eur.
        data_tests:
          - not_null
      - name: cost_recorded_at
        description: Typed source field cost_recorded_at.
        data_tests:
          - not_null
