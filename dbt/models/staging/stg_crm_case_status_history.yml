version: 2

models:
  - name: stg_crm_case_status_history
    description: Deduplicated case-status events with typed change timestamps.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 37561
    columns:
      - name: case_status_event_id
        description: Typed source field case_status_event_id.
        data_tests:
          - not_null
          - unique
      - name: case_id
        description: Typed source field case_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_crm_customer_cases')
                field: case_id
      - name: previous_status
        description: Typed source field previous_status.
      - name: new_status
        description: Typed source field new_status.
        data_tests:
          - not_null
      - name: changed_at
        description: Typed source field changed_at.
        data_tests:
          - not_null
      - name: change_reason
        description: Typed source field change_reason.
        data_tests:
          - not_null
