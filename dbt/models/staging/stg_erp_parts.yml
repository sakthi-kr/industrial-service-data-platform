version: 2

models:
  - name: stg_erp_parts
    description: Latest valid spare-part record with typed lead time and reference cost.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 300
    columns:
      - name: part_id
        description: Typed source field part_id.
        data_tests:
          - not_null
          - unique
      - name: part_name
        description: Typed source field part_name.
        data_tests:
          - not_null
      - name: part_category
        description: Typed source field part_category.
        data_tests:
          - not_null
      - name: unit_cost_eur
        description: Typed source field unit_cost_eur.
        data_tests:
          - not_null
      - name: standard_lead_time_days
        description: Typed source field standard_lead_time_days.
        data_tests:
          - not_null
      - name: part_status
        description: Typed source field part_status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ACTIVE", "OBSOLETE"]
      - name: created_at
        description: Typed source field created_at.
        data_tests:
          - not_null
      - name: updated_at
        description: Typed source field updated_at.
        data_tests:
          - not_null
