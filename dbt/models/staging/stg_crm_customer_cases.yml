version: 2

models:
  - name: stg_crm_customer_cases
    description: Latest valid customer case with typed SLA and lifecycle timestamps.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 8000
    columns:
      - name: case_id
        description: Typed source field case_id.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Typed source field customer_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_erp_customers')
                field: customer_id
      - name: site_id
        description: Typed source field site_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_erp_sites')
                field: site_id
      - name: contract_id
        description: Typed source field contract_id.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_crm_service_contracts')
                field: contract_id
      - name: asset_id
        description: Typed source field asset_id.
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_erp_assets')
                field: asset_id
      - name: case_type
        description: Typed source field case_type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["TECHNICAL_FAULT", "INSPECTION_REQUEST", "MAINTENANCE_REQUEST", "GENERAL_ENQUIRY"]
      - name: priority
        description: Typed source field priority.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["LOW", "MEDIUM", "HIGH", "CRITICAL"]
      - name: fault_category
        description: Typed source field fault_category.
      - name: case_status
        description: Typed source field case_status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["OPEN", "ASSIGNED", "IN_PROGRESS", "WAITING_PARTS", "RESOLVED", "CLOSED", "CANCELLED"]
      - name: created_at
        description: Typed source field created_at.
        data_tests:
          - not_null
      - name: response_due_at
        description: Typed source field response_due_at.
        data_tests:
          - not_null
      - name: resolution_due_at
        description: Typed source field resolution_due_at.
        data_tests:
          - not_null
      - name: first_response_at
        description: Typed source field first_response_at.
      - name: resolved_at
        description: Typed source field resolved_at.
      - name: closed_at
        description: Typed source field closed_at.
      - name: updated_at
        description: Typed source field updated_at.
        data_tests:
          - not_null
