version: 2

models:
  - name: mart_service_operations
    description: Monthly service operations metrics by region, priority, and fault category.
    columns:
      - name: reporting_month
        description: Month in which the case was created.
        data_tests: [not_null]
      - name: case_count
        description: Number of cases in the reporting group.
        data_tests: [not_null]

  - name: mart_asset_reliability
    description: Asset-level service, alert, downtime, and cost summary.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 1000
    columns:
      - name: asset_key
        description: Asset warehouse key.
        data_tests: [not_null, unique]
      - name: asset_id
        description: Source asset identifier.
        data_tests: [not_null, unique]

  - name: mart_customer_performance
    description: Customer-level asset, case, SLA, downtime, and cost summary.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 150
    columns:
      - name: customer_key
        description: Customer warehouse key.
        data_tests: [not_null, unique]
      - name: customer_id
        description: Source customer identifier.
        data_tests: [not_null, unique]

  - name: mart_kpi_summary
    description: Single-row KPI summary reconciled against independent Python calculations.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 1
    columns:
      - name: reporting_as_of
        description: Fixed UTC timestamp used for open-record and follow-up-window calculations.
        data_tests: [not_null, unique]
      - name: open_case_count
        description: Cases unresolved at the reporting timestamp.
        data_tests: [not_null]
      - name: critical_open_case_count
        description: Open cases with critical priority.
        data_tests: [not_null]
      - name: total_downtime_hours
        description: Non-overlapping equipment downtime across assets.
        data_tests: [not_null]
      - name: total_service_cost_eur
        description: Sum of valid service cost records in EUR.
        data_tests: [not_null]
