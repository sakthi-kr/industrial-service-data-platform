version: 2
models:
  - name: mart_service_operations
    description: Monthly service operations metrics by region, priority, and fault category.
    columns:
      - name: reporting_month
        description: Month in which the case was created.
        data_tests: [not_null]
      - name: case_count
        description: Number of cases in the reporting group.
        data_tests: [not_null]
      - name: response_sla_eligible_count
        description: Cases with a final response SLA outcome.
        data_tests: [not_null]
      - name: response_sla_met_count
        description: Eligible cases that met the response SLA.
        data_tests: [not_null]
      - name: resolution_sla_eligible_count
        description: Cases with a final resolution SLA outcome.
        data_tests: [not_null]
      - name: resolution_sla_met_count
        description: Eligible cases that met the resolution SLA.
        data_tests: [not_null]
  - name: mart_asset_reliability
    description: Asset-level service, alert, downtime, cost, customer, and site summary.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 1000
    columns:
      - name: asset_key
        description: Asset warehouse key.
        data_tests: [not_null, unique]
      - name: asset_id
        description: Source asset identifier.
        data_tests: [not_null, unique]
      - name: customer_id
        description: Customer identifier used by the Power BI model relationship.
        data_tests: [not_null]
      - name: site_id
        description: Site identifier for asset-level filtering.
        data_tests: [not_null]
  - name: mart_customer_performance
    description: Customer-level asset, case, SLA, downtime, and cost summary.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 150
    columns:
      - name: customer_key
        description: Customer warehouse key.
        data_tests: [not_null, unique]
      - name: customer_id
        description: Source customer identifier.
        data_tests: [not_null, unique]
  - name: mart_kpi_summary
    description: Single-row KPI summary reconciled against independent Python calculations.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 1
    columns:
      - name: reporting_as_of
        description: Fixed UTC timestamp used for open-record and follow-up-window calculations.
        data_tests: [not_null, unique]
      - name: open_case_count
        description: Cases unresolved at the reporting timestamp.
        data_tests: [not_null]
      - name: critical_open_case_count
        description: Open cases with critical priority.
        data_tests: [not_null]
      - name: total_downtime_hours
        description: Non-overlapping equipment downtime across assets.
        data_tests: [not_null]
      - name: total_service_cost_eur
        description: Sum of valid service cost records in EUR.
        data_tests: [not_null]
  - name: mart_technician_note_enrichment
    description: Evaluated structured enrichment for every generated technician note.
    data_tests:
      - row_count_equals:
          arguments:
            expected_count: 5000
    columns:
      - name: note_id
        description: Source technician-note identifier.
        data_tests: [not_null, unique]
      - name: model_version
        description: Version of the fitted enrichment pipeline.
        data_tests: [not_null]
      - name: predicted_fault_category
        description: Fault category predicted from note text and permitted context.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - BEARING
                  - CONTROL_SYSTEM
                  - ELECTRICAL
                  - FLOW
                  - INSPECTION
                  - LUBRICATION
                  - OTHER
                  - OVERHEATING
                  - PRESSURE
                  - SEAL
                  - VIBRATION
      - name: predicted_priority
        description: Synthetic triage priority predicted by the classifier.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [LOW, MEDIUM, HIGH, CRITICAL]
      - name: output_valid
        description: Whether the structured prediction passed schema validation.
        data_tests: [not_null]
      - name: fault_confidence
        description: Maximum class probability for the fault classifier.
        data_tests: [not_null]
      - name: priority_confidence
        description: Maximum class probability for the priority classifier.
        data_tests: [not_null]
