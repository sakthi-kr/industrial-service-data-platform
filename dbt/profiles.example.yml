
industrial_service_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      authenticator: "{{ env_var('SNOWFLAKE_AUTHENTICATOR', 'snowflake') }}"
      role: "{{ env_var('DBT_SNOWFLAKE_ROLE', 'ISP_TRANSFORMER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'INDUSTRIAL_SERVICE_WH') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'INDUSTRIAL_SERVICE_DB') }}"
      schema: STAGING
      threads: 4
      client_session_keep_alive: false
      query_tag: industrial-service-dbt
