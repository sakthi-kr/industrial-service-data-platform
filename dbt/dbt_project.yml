
name: industrial_service_analytics
version: 1.0.0
config-version: 2

profile: industrial_service_analytics
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  reporting_as_of: "2026-08-04 12:00:00+00:00"

models:
  industrial_service_analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: STAGING
      +materialized: view
      +tags: [staging]
    intermediate:
      +schema: CORE
      +materialized: ephemeral
      +tags: [intermediate]
    core:
      +schema: CORE
      +materialized: table
      +tags: [core]
    marts:
      +schema: ANALYTICS
      +materialized: table
      +tags: [marts]
